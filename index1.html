<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AK POLYTECHNIC | Diploma Courses</title>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      color: #222;
      background: #f3f6fb;
    }

    header {
      background: #092b58;
      color: white;
      padding: 15px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
      text-decoration: none;
    }

    .brand img {
      width: 60px;
      height: 60px;
      object-fit: contain;
      background: white;
      border-radius: 50%;
    }

    .brand h2 {
      font-size: 23px;
    }

    nav {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #ffd166;
    }

    /* Three image sliders */
    .slider-container {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
      padding: 25px;
    }

    .slider {
      height: 280px;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: #092b58;
      box-shadow: 0 5px 15px #0002;
    }

    .slider img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    .slider img.active {
      opacity: 1;
    }

    .slider::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        transparent 20%,
        rgba(0, 0, 0, 0.8)
      );
    }

    .slider-text {
      position: absolute;
      z-index: 2;
      bottom: 25px;
      left: 10px;
      right: 10px;
      text-align: center;
      color: white;
    }

    .slider-text h1 {
      font-size: clamp(18px, 2vw, 27px);
      margin-bottom: 8px;
    }

    .slider-text p {
      font-size: 14px;
    }

    .dots {
      position: absolute;
      z-index: 3;
      bottom: 8px;
      right: 0;
      left: 0;
      display: flex;
      justify-content: center;
      gap: 7px;
    }

    .dot {
      width: 9px;
      height: 9px;
      background: #ffffff80;
      border-radius: 50%;
    }

    .dot.active {
      background: #ffd166;
    }

    .welcome {
      text-align: center;
      padding: 30px 15px;
    }

    .welcome h1 {
      color: #092b58;
      margin-bottom: 12px;
    }

    .welcome p {
      line-height: 1.7;
      max-width: 750px;
      margin: auto;
    }

    .courses {
      padding: 35px 6%;
    }

    .courses h2,
    .about h2 {
      text-align: center;
      color: #092b58;
      margin-bottom: 25px;
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .course-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px #0001;
      transition: transform 0.25s;
    }

    .course-card:hover {
      transform: translateY(-5px);
    }

    .course-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .course-info {
      padding: 20px;
    }

    .course-info h3 {
      color: #092b58;
      margin-bottom: 10px;
    }

    .course-info p {
      line-height: 1.6;
      margin-bottom: 15px;
      color: #555;
    }

    .course-info button {
      background: #092b58;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    .course-info button:hover {
      background: #e69b18;
    }

    .about {
      background: white;
      padding: 40px 8%;
      text-align: center;
      line-height: 1.8;
    }

    footer {
      background: #092b58;
      color: white;
      padding: 22px;
      text-align: center;
      line-height: 1.8;
    }

    @media (max-width: 800px) {
      .slider-container {
        grid-template-columns: 1fr;
      }

      .slider {
        height: 260px;
      }

      .course-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      header {
        justify-content: center;
        text-align: center;
      }

      nav {
        justify-content: center;
      }

      .brand h2 {
        font-size: 20px;
      }

      .course-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
